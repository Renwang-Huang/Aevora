version: 2
project_name: aevora
dist: dist
builds:
  - id: native
    main: ./cmd/aevora
    binary: aevora
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-mod=readonly, -buildvcs=false, -trimpath]
    ldflags:
      - '-s -w -X github.com/Renwang-Huang/Aevora/go-runtime/internal/buildinfo.Version={{ .Version }} -X github.com/Renwang-Huang/Aevora/go-runtime/internal/buildinfo.Revision={{ .Env.AEVORA_NATIVE_REVISION }}'
archives:
  - id: native
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'aevora_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - src: ../LICENSE
        strip_parent: true
      - src: ../docs/NOTICES.md
        strip_parent: true
      - src: ../docs/QUICKSTART.md
        strip_parent: true
      - src: ../docs/LOCAL_WORKFLOW.md
        strip_parent: true
      - src: '{{ .Env.AEVORA_NATIVE_LICENSES }}/THIRD-PARTY-LICENSES.txt'
        strip_parent: true
checksum:
  name_template: aevora_CHECKSUMS.txt
snapshot:
  version_template: '{{ .Env.AEVORA_NATIVE_VERSION }}'
changelog:
  disable: true
release:
  disable: true
