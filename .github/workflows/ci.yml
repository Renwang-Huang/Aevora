name: Public packages

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: console/.nvmrc
      - name: Install public packages
        run: python -m pip install ./aevora_core ./console pytest==9.1.1
      - name: Verify package independence and public contracts
        run: |
          python -I -c "import aevora, aevora_observatory, importlib.util; assert all(importlib.util.find_spec(x) is None for x in ('benchmark','evaluator','integrations','aevora_maintainer'))"
          python -m pytest -q aevora_core/tests/unit
          python tools/sync_public_evidence.py --check
      - name: Build and check Console
        run: |
          npm --prefix console ci --ignore-scripts
          npm --prefix console test
          npm --prefix console run build
          git diff --exit-code -- console/src/aevora_observatory/static
      - name: Build public wheels
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/wheels" ./aevora_core ./console
