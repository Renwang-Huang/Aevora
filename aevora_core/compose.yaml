services:
  experience-graph:
    image: falkordb/falkordb:v4.20.4@sha256:adbddd418916c25618564ff8597a919b08bc76452ebeb74eb985c38d7281df62
    # The pinned image's run.sh ignores CMD; override it to actually load the
    # trusted config and avoid launching the bundled browser service.
    entrypoint: ["redis-server"]
    # This pinned C engine reproduced its upstream AOF GRAPH.EFFECT reload
    # crash after test-graph deletion. Preserve the AOF for postmortem; use
    # explicit RDB snapshots and graceful-stop persistence for this H1 profile.
    command: ["--loadmodule", "/var/lib/falkordb/bin/falkordb.so", "--include", "/run/secrets/aevora_redis.conf", "--appendonly", "no"]
    ports: ["127.0.0.1:${AEVORA_DB_PORT:?Set an explicitly owned DB port}:6379"]
    volumes:
      - aevora-experience-data:/data
    secrets:
      - aevora_redis.conf
      - aevora_db_password
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli ping)" = "NOAUTH Authentication required." && test "$$(REDISCLI_AUTH="$$(cat /run/secrets/aevora_db_password)" redis-cli -e ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
secrets:
  aevora_redis.conf:
    file: ${AEVORA_REDIS_CONFIG_FILE:?Set an external project config file}
  aevora_db_password:
    file: ${AEVORA_FALKORDB_PASSWORD_FILE:?Set an external owner-only password file}
volumes:
  aevora-experience-data:
