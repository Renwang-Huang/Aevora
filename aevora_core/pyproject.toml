[build-system]
requires = ["setuptools==76.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aevora-core"
version = "0.2.0"
license = {file = "LICENSE"}
description = "Aevora Experience Accountability Core powered by FalkorDB"
requires-python = ">=3.12,<3.13"
dependencies = ["falkordb==1.7.1", "redis==8.1.0", "mcp==1.26.0"]

[project.scripts]
aevora = "aevora.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aevora*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
