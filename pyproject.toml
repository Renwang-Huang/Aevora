[build-system]
requires = ["setuptools==76.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-incident-lab"
version = "0.3.1"
license = {file = "LICENSE"}
description = "OrderFlow framework with independent threaded and multi-worker incident evaluation"
requires-python = ">=3.12,<3.13"
dependencies = ["pytest==9.1.1", "pluggy==1.6.0", "iniconfig==1.1.1", "packaging==26.2", "pygments==2.19.2"]

[project.optional-dependencies]
dev = ["build==1.4.0", "wheel==0.45.1", "setuptools==76.1.0"]
benchmark = []

[project.scripts]
orderflow = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "benchmark*", "evaluator*", "integrations*", "aevora_maintainer*"]

[tool.setuptools.package-data]
benchmark = ["scenarios/*/*.json", "scenarios/*/*.md", "public_tests/*.py"]
evaluator = ["private_manifests/*.json", "private_labels/*.json", "reference_patches/*.diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
