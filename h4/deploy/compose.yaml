name: aevora-product
services:
  graph:
    image: falkordb/falkordb:v4.20.4@sha256:adbddd418916c25618564ff8597a919b08bc76452ebeb74eb985c38d7281df62
    entrypoint: ["redis-server"]
    command: ["--loadmodule", "/var/lib/falkordb/bin/falkordb.so", "--include", "/run/secrets/server.conf", "--appendonly", "no"]
    ports: ["127.0.0.1:${AEVORA_DB_PORT:-17692}:6379"]
    volumes: ["experience-data:/data"]
    secrets: [server.conf, db.password]
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli ping)" = "NOAUTH Authentication required." && test "$$(REDISCLI_AUTH="$$(cat /run/secrets/db.password)" redis-cli -e ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
secrets:
  server.conf:
    file: ${AEVORA_REDIS_CONFIG_FILE:?Create external private project config with bootstrap first}
  db.password:
    file: ${AEVORA_FALKORDB_PASSWORD_FILE:?Create external private project password with bootstrap first}
volumes:
  experience-data:
