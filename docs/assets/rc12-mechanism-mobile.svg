<svg xmlns="http://www.w3.org/2000/svg" width="380" height="596" viewBox="0 0 380 596" role="img" aria-labelledby="title desc">
<title id="title">WHEN to trusted feedback</title><desc id="desc">Presentation-only architecture guide. Context and permissions, complete Witness, accountable action, and trusted governance.</desc>
<rect width="380" height="596" rx="12" fill="var(--bg)"/>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --card: #f6f8fa; --stroke: #d1d9e0; --ink: #1f2328; --muted: #475569; --accent: #096c53; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --card: #161b22; --stroke: #30363d; --ink: #f0f6fc; --muted: #b1bac4; --accent: #7ee8c7; } }
</style>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect x="12" y="12" width="356" height="122" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="30" y="40" fill="var(--accent)" font-size="12" font-weight="600">01</text>
<text x="30" y="69" fill="var(--ink)" font-size="20" font-weight="650">WHEN</text>
<text x="30" y="95" fill="var(--muted)" font-size="18">Check scope, context,</text>
<text x="30" y="117" fill="var(--muted)" font-size="18">premises and access.</text>
<path d="M190 143v14m-4-4 4 4 4-4" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<rect x="12" y="162" width="356" height="122" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="30" y="190" fill="var(--accent)" font-size="12" font-weight="600">02</text>
<text x="30" y="219" fill="var(--ink)" font-size="20" font-weight="650">WHY</text>
<text x="30" y="245" fill="var(--muted)" font-size="18">Inspect Witness,</text>
<text x="30" y="267" fill="var(--muted)" font-size="18">outcomes and authority.</text>
<path d="M190 293v14m-4-4 4 4 4-4" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<rect x="12" y="312" width="356" height="122" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="30" y="340" fill="var(--accent)" font-size="12" font-weight="600">03</text>
<text x="30" y="369" fill="var(--ink)" font-size="20" font-weight="650">ACCOUNTABILITY</text>
<text x="30" y="395" fill="var(--muted)" font-size="18">Separate advice, choice,</text>
<text x="30" y="417" fill="var(--muted)" font-size="18">action and evaluation.</text>
<path d="M190 443v14m-4-4 4 4 4-4" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<rect x="12" y="462" width="356" height="122" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="30" y="490" fill="var(--accent)" font-size="12" font-weight="600">04</text>
<text x="30" y="519" fill="var(--ink)" font-size="20" font-weight="650">FEEDBACK</text>
<text x="30" y="545" fill="var(--muted)" font-size="18">Trusted review gates</text>
<text x="30" y="567" fill="var(--muted)" font-size="18">publication and revision.</text>
</g>
</svg>
