<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="192" viewBox="0 0 1000 192" role="img" aria-labelledby="title desc">
<title id="title">WHEN to trusted feedback</title><desc id="desc">Presentation-only architecture guide. Context and permissions, complete Witness, accountable action, and trusted governance.</desc>
<rect width="1000" height="192" rx="12" fill="var(--bg)"/>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --card: #f6f8fa; --stroke: #d1d9e0; --ink: #1f2328; --muted: #475569; --accent: #096c53; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --card: #161b22; --stroke: #30363d; --ink: #f0f6fc; --muted: #b1bac4; --accent: #7ee8c7; } }
</style>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect x="12" y="16" width="226" height="156" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="30" y="44" fill="var(--accent)" font-size="12" font-weight="600">01</text>
<text x="30" y="73" fill="var(--ink)" font-size="20" font-weight="650">WHEN</text>
<text x="30" y="99" fill="var(--muted)" font-size="16">Check scope, context,</text>
<text x="30" y="121" fill="var(--muted)" font-size="16">premises and access.</text>
<path d="M244 94h12m-4-4 4 4-4 4" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<rect x="262" y="16" width="226" height="156" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="280" y="44" fill="var(--accent)" font-size="12" font-weight="600">02</text>
<text x="280" y="73" fill="var(--ink)" font-size="20" font-weight="650">WHY</text>
<text x="280" y="99" fill="var(--muted)" font-size="16">Inspect Witness,</text>
<text x="280" y="121" fill="var(--muted)" font-size="16">outcomes and authority.</text>
<path d="M494 94h12m-4-4 4 4-4 4" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<rect x="512" y="16" width="226" height="156" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="530" y="44" fill="var(--accent)" font-size="12" font-weight="600">03</text>
<text x="530" y="73" fill="var(--ink)" font-size="20" font-weight="650">ACCOUNTABILITY</text>
<text x="530" y="99" fill="var(--muted)" font-size="16">Separate advice, choice,</text>
<text x="530" y="121" fill="var(--muted)" font-size="16">action and evaluation.</text>
<path d="M744 94h12m-4-4 4 4-4 4" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<rect x="762" y="16" width="226" height="156" rx="10" fill="var(--card)" stroke="var(--stroke)"/>
<text x="780" y="44" fill="var(--accent)" font-size="12" font-weight="600">04</text>
<text x="780" y="73" fill="var(--ink)" font-size="20" font-weight="650">FEEDBACK</text>
<text x="780" y="99" fill="var(--muted)" font-size="16">Trusted review gates</text>
<text x="780" y="121" fill="var(--muted)" font-size="16">publication and revision.</text>
</g>
</svg>
